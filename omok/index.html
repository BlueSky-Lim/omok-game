<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="동물 오목">
<meta name="theme-color" content="#ffe9e0">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" href="../icon.png">
<title>동물 친구 오목</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff4e6; --bg2:#ffe3ec;
    --board:#ffe9b8; --board-edge:#f4c97a; --line:#c9955a;
    --ink:#5b3a29; --soft:#8a6a55;
    --p1:#ffb3c7; --p1d:#f27a9b;
    --p2:#a8d8ff; --p2d:#5aa9e6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  button,.cell,.avatar{touch-action:manipulation}
  body{
    font-family:'Jua',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 10% 15%,#fff 0 6px,transparent 7px),
      radial-gradient(circle at 85% 8%,#fff 0 4px,transparent 5px),
      radial-gradient(circle at 92% 70%,#fff 0 7px,transparent 8px),
      radial-gradient(circle at 6% 80%,#fff 0 5px,transparent 6px),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 14px);
    min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;
  }
  h1{margin:4px 0 2px;font-size:clamp(26px,6vw,40px);font-weight:400;letter-spacing:1px;
     text-shadow:0 3px 0 #fff,0 5px 0 rgba(242,122,155,.25)}
  h1 .dot{display:inline-block;animation:bob 2s ease-in-out infinite}
  h1 .dot:nth-child(2){animation-delay:.3s}
  @keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
  .sub{color:var(--soft);font-size:15px;margin-bottom:12px}

  /* 세로형: 판이 화면 폭을 꽉 채우되, 위아래 영역(약 330px)을 빼고 남는 높이를 넘지 않게 */
  .wrap{width:min(96vw, calc(100dvh - 330px), 900px);min-width:300px;
        display:flex;flex-direction:column}
  @supports not (height:100dvh){ .wrap{width:min(96vw, calc(100vh - 330px), 900px)} }
  /* 가로로 돌렸을 때도 잘리지 않게 */
  @media (orientation:landscape){
    .wrap{width:min(96vw, calc(100dvh - 300px), 900px)}
  }

  /* player bar */
  .players{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
  .pcard{
    background:#fff;border-radius:22px;padding:10px 12px;display:flex;align-items:center;gap:10px;
    box-shadow:0 4px 0 rgba(0,0,0,.06);border:4px solid transparent;transition:.25s;
    position:relative;
  }
  .pcard.p1{--c:var(--p1);--cd:var(--p1d)}
  .pcard.p2{--c:var(--p2);--cd:var(--p2d);flex-direction:row-reverse;text-align:right}
  .pcard.active{border-color:var(--cd);transform:scale(1.04);box-shadow:0 6px 0 var(--c)}
  .pcard.active::after{
    content:'내 차례!';position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    background:var(--cd);color:#fff;font-size:13px;padding:2px 10px;border-radius:99px;white-space:nowrap;
    animation:pop .4s
  }
  .avatar{
    width:48px;height:48px;border-radius:50%;background:var(--c);flex:none;
    display:grid;place-items:center;font-size:28px;cursor:pointer;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);transition:transform .15s
  }
  .avatar:active{transform:scale(.9)}
  .pinfo{min-width:0;flex:1}
  .pname{
    font-family:inherit;font-size:18px;color:var(--ink);border:none;background:transparent;
    width:100%;outline:none;padding:0;text-align:inherit;
  }
  .pname:focus{border-bottom:2px dashed var(--cd)}
  .wins{font-size:14px;color:var(--soft)}
  .wins b{color:var(--cd);font-size:18px;font-weight:400}
  .vs{font-size:22px;color:var(--p1d)}

  /* board */
  .board-shell{
    background:var(--board);border-radius:26px;padding:3.2%;
    box-shadow:0 8px 0 var(--board-edge),0 14px 30px rgba(180,120,60,.25);
    position:relative;
  }
  .board{position:relative;width:100%;aspect-ratio:1}
  .board svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .grid{position:absolute;inset:0;display:grid}
  .cell{position:relative;cursor:pointer;display:grid;place-items:center}
  .cell .ghost{
    width:82%;height:82%;border-radius:50%;opacity:0;transition:opacity .12s;
    background:var(--ghost);display:grid;place-items:center;font-size:var(--fs);
  }
  @media (hover:hover){ .cell.empty:hover .ghost{opacity:.45} }
  .stone{
    width:88%;height:88%;border-radius:50%;display:grid;place-items:center;
    font-size:var(--fs);line-height:1;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 3px rgba(0,0,0,.18);
    animation:drop .32s cubic-bezier(.3,1.6,.5,1);position:relative;z-index:1
  }
  .stone.p1{background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--p1) 30%)}
  .stone.p2{background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--p2) 30%)}
  .stone.last::after{
    content:'';position:absolute;inset:-14%;border-radius:50%;
    border:3px solid #ffd23f;animation:ring 1.2s ease-in-out infinite
  }
  .stone.win{animation:dance .6s ease-in-out infinite alternate;z-index:2}
  .stone.win::before{
    content:'';position:absolute;inset:-12%;border-radius:50%;
    background:radial-gradient(circle,#fff6a0 40%,transparent 70%);z-index:-1
  }
  @keyframes drop{0%{transform:scale(0) translateY(-40%)}100%{transform:scale(1)}}
  @keyframes ring{50%{transform:scale(1.12);opacity:.5}}
  @keyframes dance{to{transform:scale(1.18) rotate(10deg)}}
  @keyframes pop{0%{transform:translateX(-50%) scale(0)}80%{transform:translateX(-50%) scale(1.15)}}

  /* buttons */
  .controls{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-size:17px;color:var(--ink);background:#fff;border:none;
    padding:10px 18px;border-radius:99px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.1);transition:transform .1s
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  .btn.primary{background:var(--p1d);color:#fff;box-shadow:0 4px 0 #c95476}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{text-align:center;color:var(--soft);font-size:14px;margin-top:12px}

  /* overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(91,58,41,.35);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px
  }
  .overlay.show{display:flex}
  .modal{
    background:#fff;border-radius:30px;padding:26px 24px 22px;text-align:center;
    width:min(92vw,360px);animation:modal .45s cubic-bezier(.3,1.6,.5,1)
  }
  @keyframes modal{from{transform:scale(.4);opacity:0}}
  .modal .big{font-size:76px;line-height:1;margin-bottom:6px;animation:bob 1s ease-in-out infinite}
  .modal h2{margin:4px 0;font-weight:400;font-size:28px}
  .modal p{margin:6px 0 16px;color:var(--soft)}
  .pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 16px}
  .pick button{
    font-size:30px;aspect-ratio:1;border-radius:50%;border:3px solid transparent;
    background:#fff6ee;cursor:pointer;transition:transform .1s
  }
  .pick button:active{transform:scale(.9)}
  .pick button.sel{border-color:var(--selc)}
  .pick button:disabled{opacity:.25;cursor:default}

  .home{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:40;
    width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;
    font-size:26px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.1)}
  .home:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  @media (max-width:440px){
    .avatar{width:40px;height:40px;font-size:23px}
    .pname{font-size:16px}
    .pcard{padding:8px;gap:7px}
    .vs{font-size:16px}
  }
  @media (min-width:700px){
    h1{font-size:46px}
    .sub{font-size:19px;margin-bottom:18px}
    .players{margin-bottom:22px;gap:18px}
    .avatar{width:64px;height:64px;font-size:38px}
    .pname{font-size:24px}
    .wins{font-size:17px} .wins b{font-size:24px}
    .vs{font-size:28px}
    .pcard{padding:12px 16px;border-radius:26px}
    .pcard.active::after{font-size:16px;top:-16px}
    .btn{font-size:21px;padding:14px 24px}
    .controls{margin-top:28px;gap:14px}
    .hint{font-size:16px}
  }
</style>
</head>
<body>
  <a class="home" href="../index.html" aria-label="처음 화면">🏠</a>
  <h1><span class="dot">🐰</span> 동물 친구 오목 <span class="dot">🐻</span></h1>
  <div class="sub">같은 친구 다섯 개를 한 줄로 놓으면 이겨요!</div>

  <div class="wrap">
    <div class="players">
      <div class="pcard p1" id="card1">
        <div class="avatar" id="av1" title="눌러서 동물 바꾸기"></div>
        <div class="pinfo">
          <input class="pname" id="name1" maxlength="8" value="아이">
          <div class="wins"><b id="w1">0</b> 승</div>
        </div>
      </div>
      <div class="vs">VS</div>
      <div class="pcard p2" id="card2">
        <div class="avatar" id="av2" title="눌러서 동물 바꾸기"></div>
        <div class="pinfo">
          <input class="pname" id="name2" maxlength="8" value="엄마아빠">
          <div class="wins"><b id="w2">0</b> 승</div>
        </div>
      </div>
    </div>

    <div class="board-shell">
      <div class="board" id="board">
        <svg class="lines" id="lines"></svg>
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="undo">↩️ 한 수 무르기</button>
      <button class="btn" id="sizeBtn">📏 판 크기: 15줄</button>
      <button class="btn" id="sound">🔊 소리 켜짐</button>
      <button class="btn primary" id="restart">🌈 새 게임</button>
    </div>
    <div class="hint">동그란 동물 얼굴을 누르면 친구를 바꿀 수 있어요 · 이름도 바꿀 수 있어요</div>
  </div>

  <!-- win modal -->
  <div class="overlay" id="winOv">
    <div class="modal">
      <div class="big" id="winFace">🐰</div>
      <h2 id="winTitle">승리!</h2>
      <p id="winMsg">정말 멋져요!</p>
      <button class="btn primary" id="again">한 판 더! 🎉</button>
      <button class="btn" id="look" style="margin-left:6px">판 보기</button>
    </div>
  </div>

  <!-- animal picker -->
  <div class="overlay" id="pickOv">
    <div class="modal">
      <h2>어떤 친구로 할까?</h2>
      <div class="pick" id="pickGrid"></div>
      <button class="btn" id="pickClose">닫기</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

<script>
(() => {
  const ANIMALS = ['🐰','🐻','🐱','🐶','🐥','🐸','🐼','🦊','🐷','🐵','🐨','🦁'];
  const CHEERS = ['정말 멋져요!','최고야 최고!','대단해요! 짝짝짝','천재 오목왕 탄생!','우와, 다섯 개 완성!'];
  const $ = id => document.getElementById(id);

  let N = 15;
  let board, turn, history, over, winLine;
  const wins = [0,0,0];
  const animal = [null,'🐰','🐻'];
  let soundOn = true;

  // ---------- sound ----------
  let ac = null;
  function tone(freq, dur=0.12, type='sine', vol=0.18, when=0){
    if(!soundOn) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const t = ac.currentTime + when;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  const placeSound = p => { tone(p===1?660:520,.09,'triangle'); tone(p===1?990:780,.08,'sine',.08,.04); };
  const winSound = () => [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.2,i*.12));
  const undoSound = () => { tone(400,.08,'sine'); tone(300,.1,'sine',.15,.07); };

  // ---------- board drawing ----------
  function drawLines(){
    const svg = $('lines'); const s = 100/N, h = s/2;
    let html = '';
    for(let i=0;i<N;i++){
      const p = h + i*s;
      html += `<line x1="${h}" y1="${p}" x2="${100-h}" y2="${p}"/>`;
      html += `<line x1="${p}" y1="${h}" x2="${p}" y2="${100-h}"/>`;
    }
    // star points
    const stars = N===15 ? [3,7,11] : N===13 ? [3,6,9] : [2,4,6];
    stars.forEach(r=>stars.forEach(c=>{
      html += `<circle cx="${h+c*s}" cy="${h+r*s}" r="${s*0.11}" fill="#c9955a"/>`;
    }));
    html += `<rect x="${h}" y="${h}" width="${100-2*h}" height="${100-2*h}" fill="none" stroke="#c9955a" stroke-width="0.55" rx="0.3"/>`;
    svg.setAttribute('viewBox','0 0 100 100');
    svg.innerHTML = `<g stroke="#c9955a" stroke-width="0.32" stroke-linecap="round">${html}</g>`;
  }

  function buildGrid(){
    const g = $('grid');
    g.style.gridTemplateColumns = `repeat(${N},1fr)`;
    g.style.gridTemplateRows = `repeat(${N},1fr)`;
    g.innerHTML = '';
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const d = document.createElement('div');
      d.className = 'cell empty'; d.dataset.r=r; d.dataset.c=c;
      d.innerHTML = '<div class="ghost"></div>';
      g.appendChild(d);
    }
    sizeFont();
  }
  function sizeFont(){
    const w = $('board').clientWidth / N;
    $('board').style.setProperty('--fs', (w*0.58)+'px');
  }
  window.addEventListener('resize', sizeFont);

  const cellEl = (r,c) => $('grid').children[r*N+c];

  function updateGhost(){
    document.documentElement.style.setProperty('--ghost', turn===1?'var(--p1)':'var(--p2)');
    $('grid').querySelectorAll('.cell.empty .ghost').forEach(g=>g.textContent = animal[turn]);
  }

  function renderStone(r,c,p){
    const el = cellEl(r,c);
    el.className = 'cell';
    el.innerHTML = `<div class="stone p${p}">${animal[p]}</div>`;
  }

  function markLast(){
    document.querySelectorAll('.stone.last').forEach(s=>s.classList.remove('last'));
    const m = history[history.length-1];
    if(m && !over) cellEl(m.r,m.c).firstChild.classList.add('last');
  }

  function updateUI(){
    $('card1').classList.toggle('active', !over && turn===1);
    $('card2').classList.toggle('active', !over && turn===2);
    $('av1').textContent = animal[1]; $('av2').textContent = animal[2];
    $('w1').textContent = wins[1]; $('w2').textContent = wins[2];
    $('undo').disabled = history.length===0;
    updateGhost();
  }

  // ---------- game logic ----------
  function newGame(){
    board = Array.from({length:N},()=>Array(N).fill(0));
    history = []; over = false; winLine = null;
    // loser of last game (or player 1) starts
    turn = turn && lastWinner ? (lastWinner===1?2:1) : 1;
    buildGrid(); drawLines(); updateUI();
  }
  let lastWinner = 0;

  function checkWin(r,c,p){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      const line = [[r,c]];
      for(const s of [1,-1]){
        let rr=r+dr*s, cc=c+dc*s;
        while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===p){ line.push([rr,cc]); rr+=dr*s; cc+=dc*s; }
      }
      if(line.length>=5) return line;
    }
    return null;
  }

  function play(r,c){
    if(over || board[r][c]) return;
    board[r][c] = turn; history.push({r,c,p:turn});
    renderStone(r,c,turn); placeSound(turn);
    const line = checkWin(r,c,turn);
    if(line){ finish(turn,line); return; }
    if(history.length===N*N){ draw(); return; }
    turn = turn===1?2:1;
    markLast(); updateUI();
  }

  function finish(p,line){
    over = true; lastWinner = p; wins[p]++; winLine = line;
    line.forEach(([r,c])=>cellEl(r,c).firstChild.classList.add('win'));
    markLast(); updateUI(); winSound();
    setTimeout(()=>{
      $('winFace').textContent = animal[p];
      $('winTitle').textContent = `${$('name'+p).value || (p===1?'1번':'2번')} 승리!`;
      $('winMsg').textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)];
      $('winOv').classList.add('show');
      confetti(p);
    }, 650);
  }
  function draw(){
    over = true; updateUI();
    $('winFace').textContent = '🤝';
    $('winTitle').textContent = '비겼어요!';
    $('winMsg').textContent = '둘 다 정말 잘했어요!';
    $('winOv').classList.add('show');
  }

  function undo(){
    if(!history.length) return;
    if(over){
      // undoing the winning move
      wins[lastWinner]--; lastWinner = 0; over = false;
      document.querySelectorAll('.stone.win').forEach(s=>s.classList.remove('win'));
    }
    const m = history.pop();
    board[m.r][m.c] = 0;
    const el = cellEl(m.r,m.c);
    el.className = 'cell empty'; el.innerHTML = '<div class="ghost"></div>';
    turn = m.p; undoSound();
    markLast(); updateUI();
  }

  // ---------- events ----------
  $('grid').addEventListener('click', e=>{
    const cell = e.target.closest('.cell'); if(!cell) return;
    play(+cell.dataset.r, +cell.dataset.c);
  });
  $('undo').onclick = undo;
  $('restart').onclick = () => { $('winOv').classList.remove('show'); newGame(); };
  $('again').onclick = () => { $('winOv').classList.remove('show'); newGame(); };
  $('look').onclick = () => $('winOv').classList.remove('show');
  $('sound').onclick = () => { soundOn=!soundOn; $('sound').textContent = soundOn?'🔊 소리 켜짐':'🔈 소리 꺼짐'; if(soundOn) tone(700,.08); };
  const SIZES = [15,13,9];
  $('sizeBtn').onclick = () => {
    if(history.length && !over && !confirmSize) { askSize(); return; }
    N = SIZES[(SIZES.indexOf(N)+1)%SIZES.length];
    $('sizeBtn').textContent = `📏 판 크기: ${N}줄`;
    confirmSize = false; newGame();
  };
  // gentle confirm (no browser dialogs): second tap within 2s changes size
  let confirmSize = false, sizeTimer;
  function askSize(){
    confirmSize = true;
    $('sizeBtn').textContent = '한 번 더 누르면 새 판!';
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(()=>{ confirmSize=false; $('sizeBtn').textContent=`📏 판 크기: ${N}줄`; },2000);
  }

  // animal picker
  let picking = 1;
  function openPick(p){
    picking = p;
    const other = animal[p===1?2:1];
    const grid = $('pickGrid'); grid.innerHTML = '';
    grid.style.setProperty('--selc', p===1?'var(--p1d)':'var(--p2d)');
    ANIMALS.forEach(a=>{
      const b = document.createElement('button');
      b.textContent = a;
      if(a===animal[p]) b.classList.add('sel');
      if(a===other) b.disabled = true;
      b.onclick = () => {
        animal[p] = a; tone(880,.08,'triangle');
        // update stones already on the board
        document.querySelectorAll('.stone.p'+p).forEach(s=>s.textContent=a);
        updateUI(); $('pickOv').classList.remove('show');
      };
      grid.appendChild(b);
    });
    $('pickOv').classList.add('show');
  }
  $('av1').onclick = () => openPick(1);
  $('av2').onclick = () => openPick(2);
  $('pickClose').onclick = () => $('pickOv').classList.remove('show');
  $('pickOv').addEventListener('click', e=>{ if(e.target.id==='pickOv') $('pickOv').classList.remove('show'); });

  // ---------- confetti ----------
  function confetti(p){
    const cv = $('confetti'), ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#ffb3c7','#a8d8ff','#ffe066','#b8f2c2','#d7b8ff','#ffcf9e'];
    const bits = Array.from({length:140},()=>({
      x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*0.5,
      vx: (Math.random()-.5)*3, vy: 2+Math.random()*3,
      s: 6+Math.random()*8, r: Math.random()*6, vr:(Math.random()-.5)*.25,
      c: colors[Math.floor(Math.random()*colors.length)],
      heart: Math.random()<.25
    }));
    let t0 = performance.now();
    (function frame(now){
      ctx.clearRect(0,0,cv.width,cv.height);
      bits.forEach(b=>{
        b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; b.vy+=0.03;
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c;
        if(b.heart){ ctx.font=`${b.s*1.6}px sans-serif`; ctx.fillText('💖',0,0); }
        else ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);
        ctx.restore();
      });
      if(now-t0<3800) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
    })(t0);
  }

  // remember names/animals on this device (best effort)
  try{
    const saved = JSON.parse(localStorage.getItem('omok-kids')||'null');
    if(saved){ $('name1').value=saved.n1||$('name1').value; $('name2').value=saved.n2||$('name2').value;
      if(saved.a1) animal[1]=saved.a1; if(saved.a2) animal[2]=saved.a2; }
  }catch(e){}
  const save = () => { try{ localStorage.setItem('omok-kids', JSON.stringify({n1:$('name1').value,n2:$('name2').value,a1:animal[1],a2:animal[2]})); }catch(e){} };
  $('name1').addEventListener('input',save); $('name2').addEventListener('input',save);
  document.addEventListener('click',save);

  newGame();
})();
</script>
</body>
</html>
