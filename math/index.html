<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff6d6">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" href="../icon.png">
<title>산수 놀이 · 우리집 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--ink:#5b3a29;--soft:#8a6a55;--y:#ffd76a;--yd:#f2b632;--pk:#f27a9b;--bl:#5aa9e6;--gr:#6cbf5a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;min-height:100%;overscroll-behavior:none}
  button,a{touch-action:manipulation}
  body{
    font-family:'Jua',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;
    background:
      radial-gradient(circle at 10% 15%,#fff 0 6px,transparent 7px),
      radial-gradient(circle at 85% 8%,#fff 0 4px,transparent 5px),
      radial-gradient(circle at 92% 70%,#fff 0 7px,transparent 8px),
      radial-gradient(circle at 6% 85%,#fff 0 5px,transparent 6px),
      linear-gradient(160deg,#fff8dc,#ffe9ef);
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 16px);
    display:flex;flex-direction:column;align-items:center;
  }
  .home{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:40;
    width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;border:none;
    font-size:26px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.1);cursor:pointer;font-family:inherit}
  .home:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  h1{margin:4px 0 2px;font-size:clamp(28px,6.5vw,48px);font-weight:400;text-shadow:0 3px 0 #fff,0 5px 0 rgba(242,182,50,.3)}
  .sub{color:var(--soft);font-size:clamp(15px,3vw,20px);margin-bottom:clamp(14px,3vh,28px);text-align:center}
  .screen{display:none;width:min(94vw,760px);flex:1;flex-direction:column}
  .screen.show{display:flex}

  /* 단계 고르기 */
  .stages{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,2.2vw,18px)}
  .stage{font-family:inherit;color:inherit;border:none;background:#fff;border-radius:24px;cursor:pointer;
    padding:clamp(10px,2vw,16px) 12px;display:flex;align-items:center;gap:12px;text-align:left;
    box-shadow:0 5px 0 var(--c,#ffe4a8);transition:transform .1s;animation:in .4s cubic-bezier(.3,1.5,.5,1) backwards}
  .stage:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c,#ffe4a8)}
  @keyframes in{from{transform:scale(.6);opacity:0}}
  .stage .ic{width:clamp(48px,10vw,72px);aspect-ratio:1;border-radius:30%;background:var(--c,#ffe4a8);display:grid;place-items:center;
    font-size:clamp(28px,6vw,44px);flex:none}
  .stage .num{font-size:clamp(13px,2.4vw,16px);color:var(--soft)}
  .stage .nm{font-size:clamp(18px,3.6vw,26px);line-height:1.15}
  .stage .stars{font-size:clamp(14px,2.8vw,20px);letter-spacing:1px;margin-top:2px}
  .stars .off{filter:grayscale(1);opacity:.3}
  .total{text-align:center;margin-top:18px;color:var(--soft);font-size:clamp(15px,3vw,20px)}

  /* 문제 화면 */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .stitle{flex:1;text-align:center;font-size:clamp(20px,4vw,30px)}
  .prog{display:flex;gap:6px;justify-content:center;margin-bottom:clamp(12px,2.5vh,22px)}
  .prog i{width:clamp(18px,3.6vw,30px);height:clamp(18px,3.6vw,30px);border-radius:50%;background:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);
    display:grid;place-items:center;font-style:normal;font-size:clamp(11px,2.2vw,17px)}
  .prog i.now{background:var(--y);transform:scale(1.2)}
  .prog i.ok{background:#c6ecb6} .prog i.retry{background:#ffd6c2}
  .card{background:#fff;border-radius:32px;padding:clamp(18px,4vw,34px) clamp(14px,3vw,28px);text-align:center;
    box-shadow:0 8px 0 #ffe4a8,0 16px 30px rgba(0,0,0,.06);position:relative}
  .qno{color:var(--soft);font-size:clamp(15px,3vw,20px)}
  .q{font-size:clamp(48px,12vw,104px);line-height:1.15;margin:6px 0;letter-spacing:2px;word-break:keep-all}
  .q.story{font-size:clamp(22px,4.8vw,38px);line-height:1.45;letter-spacing:0;margin:10px 4px}
  .q .box{display:inline-block;min-width:1.1em;border:5px dashed var(--yd);border-radius:16px;color:var(--yd);line-height:1.05;padding:0 .1em}
  .q .op{color:var(--pk)}
  .tools{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:clamp(16px,3.2vw,22px);color:var(--ink);background:#fff6d6;border:none;padding:10px 18px;
    border-radius:99px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.1)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  .btn.primary{background:var(--yd);color:#fff;box-shadow:0 4px 0 #c98f12}
  .btn.hint{background:#fff1b8}

  .hintbox{display:none;margin-top:14px;background:#fffbea;border:3px dashed #f6d58a;border-radius:22px;padding:12px 10px 14px;
    animation:in .35s cubic-bezier(.3,1.5,.5,1)}
  .hintbox.show{display:block}
  .htext{font-size:clamp(17px,3.4vw,24px);line-height:1.4;margin-bottom:8px;word-break:keep-all}
  .pics{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px}
  .grp{display:grid;grid-template-columns:repeat(5,auto);gap:2px 4px;padding:6px 8px;border-radius:16px;background:#fff}
  .grp.b{background:#e9f4ff} .grp.a{background:#ffeef3}
  .it{font-size:clamp(24px,5vw,38px);line-height:1.1;position:relative;animation:pop .3s backwards}
  @keyframes pop{from{transform:scale(0)}}
  .it.gone{opacity:.35}
  .it.gone::after{content:'';position:absolute;left:-8%;right:-8%;top:50%;height:4px;background:#e5484d;border-radius:4px;transform:rotate(-35deg)}
  .it.empty{display:inline-block;width:1.1em;height:1.1em;border:3px dashed #e4c27a;border-radius:50%;opacity:.9}
  .sign{font-size:clamp(28px,6vw,44px);color:var(--pk)}
  .frame{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#f6d58a;padding:5px;border-radius:12px}
  .frame span{background:#fff;border-radius:8px;width:clamp(36px,7vw,56px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(22px,4.6vw,36px)}

  .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,2.6vw,20px);margin-top:clamp(16px,3vh,28px)}
  .ans{font-family:inherit;font-size:clamp(40px,10vw,80px);color:var(--ink);border:none;border-radius:28px;cursor:pointer;
    padding:clamp(8px,1.6vh,16px) 0;background:#fff;box-shadow:0 7px 0 var(--c);transition:transform .1s}
  .ans:nth-child(1){--c:#ffc4d4} .ans:nth-child(2){--c:#bfe2ff} .ans:nth-child(3){--c:#c6ecb6} .ans:nth-child(4){--c:#e2d0ff}
  .ans:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c)}
  .ans.wrong{background:#eee;color:#bbb;box-shadow:0 3px 0 #ddd;animation:shake .4s;pointer-events:none}
  .ans.right{background:#7fd36b;color:#fff;box-shadow:0 7px 0 #4a9a3a;animation:yay .5s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes yay{50%{transform:scale(1.12)}}

  .fb{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(70px,18vw,150px);pointer-events:none;z-index:30;
    opacity:0;text-shadow:0 6px 0 #fff}
  .fb.show{animation:fb .9s ease-out}
  @keyframes fb{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
  .say{text-align:center;min-height:1.4em;margin-top:12px;font-size:clamp(18px,3.6vw,26px);color:var(--pk)}

  /* 결과 */
  .result{text-align:center;background:#fff;border-radius:34px;padding:30px 20px;box-shadow:0 8px 0 #ffe4a8;margin-top:4vh}
  .result .big{font-size:clamp(70px,16vw,120px);line-height:1;animation:bob 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
  .result h2{font-weight:400;font-size:clamp(28px,6vw,44px);margin:10px 0 4px}
  .result .rs{font-size:clamp(40px,9vw,70px);letter-spacing:4px;margin:8px 0}
  .result p{color:var(--soft);font-size:clamp(16px,3.2vw,22px);margin:4px 0 20px}
  .result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
  @media (max-width:440px){ h1{margin-left:40px} }
</style>
</head>
<body>
  <a class="home" id="homeBtn" href="../index.html" aria-label="처음 화면">🏠</a>

  <!-- 단계 고르기 -->
  <div class="screen show" id="scMenu">
    <h1 style="text-align:center">🧮 산수 놀이</h1>
    <div class="sub">10단계 · 100문제! 어디부터 해 볼까?</div>
    <div class="stages" id="stages"></div>
    <div class="total" id="total"></div>
  </div>

  <!-- 문제 -->
  <div class="screen" id="scPlay">
    <div class="topbar"><div class="stitle" id="stitle"></div></div>
    <div class="prog" id="prog"></div>
    <div class="card">
      <div class="qno" id="qno"></div>
      <div class="q" id="q"></div>
      <div class="tools">
        <button class="btn" id="read">🔊 읽어 주기</button>
        <button class="btn hint" id="hintBtn">💡 힌트</button>
      </div>
      <div class="hintbox" id="hintbox"><div class="htext" id="htext"></div><div class="pics" id="pics"></div></div>
    </div>
    <div class="answers" id="answers"></div>
    <div class="say" id="say"></div>
  </div>

  <!-- 결과 -->
  <div class="screen" id="scDone">
    <div class="result">
      <div class="big" id="rFace">🏆</div>
      <h2 id="rTitle">다 풀었어요!</h2>
      <div class="rs" id="rStars"></div>
      <p id="rMsg"></p>
      <div class="row">
        <button class="btn" id="rAgain">🔁 다시 하기</button>
        <button class="btn" id="rMenu">📋 단계 고르기</button>
        <button class="btn primary" id="rNext">다음 단계 ▶</button>
      </div>
    </div>
  </div>

  <div class="fb" id="fb"></div>
  <canvas id="confetti"></canvas>

    const colors=['#ffb3c7','#a8d8ff','#ffe066','#b8f2c2','#d7b8ff','#ffcf9e'];
    const bits=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,
      vy:2+Math.random()*3,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:colors[Math.floor(Math.random()*6)],h:Math.random()<.25}));
    const t0=performance.now();
    (function f(now){ x.clearRect(0,0,c.width,c.height);
      bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.vy+=.03;x.save();x.translate(b.x,b.y);x.rotate(b.r);x.fillStyle=b.c;
        if(b.h){x.font=`${b.s*1.6}px sans-serif`;x.fillText('💖',0,0);} else x.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);x.restore();});
      if(now-t0<3800) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
  }

  window.__math = { DATA, hintFor:(i,j)=>{ const ps=probs, s=si; probs=DATA[i].probs; si=i; const r=hintFor(DATA[i].probs[j]); probs=ps; si=s; return r; }, start };
  drawMenu();
})();
</script>
