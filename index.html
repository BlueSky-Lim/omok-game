<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 놀이터">
<meta name="theme-color" content="#ffe9e0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>우리집 놀이터 · 미니게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;min-height:100%;overscroll-behavior:none}
  body{
    font-family:'Jua',system-ui,sans-serif;color:#5b3a29;user-select:none;-webkit-user-select:none;
    background:
      radial-gradient(circle at 12% 12%,#fff 0 7px,transparent 8px),
      radial-gradient(circle at 88% 9%,#fff 0 5px,transparent 6px),
      radial-gradient(circle at 93% 64%,#fff 0 8px,transparent 9px),
      radial-gradient(circle at 5% 78%,#fff 0 6px,transparent 7px),
      radial-gradient(circle at 50% 96%,#fff 0 5px,transparent 6px),
      linear-gradient(160deg,#fff4e6,#ffe3ec 55%,#e6f0ff);
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 28px);
  }
  .sun{font-size:clamp(54px,12vw,96px);line-height:1;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{margin:8px 0 4px;font-weight:400;font-size:clamp(34px,8vw,64px);letter-spacing:2px;
     text-shadow:0 4px 0 #fff,0 7px 0 rgba(242,122,155,.25)}
  .sub{color:#8a6a55;font-size:clamp(16px,3.4vw,24px);margin-bottom:clamp(24px,5vh,48px)}
  .games{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,3vw,28px);width:min(92vw,720px)}
  .card{
    --c:#ffb3c7;--cd:#f27a9b;
    background:#fff;border-radius:34px;padding:clamp(18px,3.5vw,32px) 12px clamp(16px,3vw,26px);
    text-decoration:none;color:inherit;text-align:center;
    box-shadow:0 8px 0 var(--c),0 14px 26px rgba(0,0,0,.08);
    transition:transform .15s;position:relative;overflow:hidden;
    animation:in .5s cubic-bezier(.3,1.5,.5,1) backwards;
  }
  .card:nth-child(2){animation-delay:.08s} .card:nth-child(3){animation-delay:.16s} .card:nth-child(4){animation-delay:.24s}
  @keyframes in{from{transform:scale(.5) translateY(30px);opacity:0}}
  .card:active{transform:translateY(6px) scale(.98);box-shadow:0 2px 0 var(--c)}
  .card::before{content:'';position:absolute;inset:auto -30% 62% -30%;height:120%;border-radius:50%;
     background:var(--c);opacity:.22}
  .icon{
    position:relative;width:clamp(86px,19vw,150px);aspect-ratio:1;margin:0 auto 10px;border-radius:30%;
    background:var(--c);display:grid;place-items:center;font-size:clamp(50px,11vw,88px);
    box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);
  }
  .card:hover .icon{animation:wiggle .5s}
  @keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .name{position:relative;font-size:clamp(24px,5vw,40px)}
  .desc{position:relative;color:#8a6a55;font-size:clamp(14px,2.8vw,20px);margin-top:4px}
  .card.omok{--c:#ffb3c7;--cd:#f27a9b}
  .card.alkka{--c:#a8d8ff;--cd:#5aa9e6}
  .card.chess{--c:#c6ecb6;--cd:#6cbf5a}
  .card.soon{--c:#eee3d8;box-shadow:none;border:4px dashed #e6d3c2;background:rgba(255,255,255,.55);pointer-events:none}
  .card.soon .icon{background:#f5ece3;filter:grayscale(.3)}
  .chess-glyph{font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans",serif;color:#fff;
     -webkit-text-stroke:3px #4a7a3e;paint-order:stroke fill;font-size:1.1em}
</style>
</head>
<body>
  <div class="sun">🌞</div>
  <h1>우리집 놀이터</h1>
  <div class="sub">무슨 게임 할까? 하나 골라 봐!</div>

  <div class="games">
    <a class="card omok" href="omok/index.html">
      <div class="icon">🐰</div>
      <div class="name">오목</div>
      <div class="desc">다섯 개를 한 줄로!</div>
    </a>
    <a class="card alkka" href="alkkagi/index.html">
      <div class="icon">🎯</div>
      <div class="name">알까기</div>
      <div class="desc">당겨서 톡! 밀어내기</div>
    </a>
    <a class="card chess" href="chess/index.html">
      <div class="icon"><span class="chess-glyph">♞&#xFE0E;</span></div>
      <div class="name">체스</div>
      <div class="desc">킹을 잡아라!</div>
    </a>
    <div class="card soon">
      <div class="icon">🎁</div>
      <div class="name">곧 만나요</div>
      <div class="desc">새 게임 준비 중</div>
    </div>
  </div>
</body>
</html>
